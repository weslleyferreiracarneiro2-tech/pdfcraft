# USINANDO: builds the Windows app from the `usinando` branch (PdfCraft plus "Print selected
# area") and runs the tests of that feature. Not part of PdfCraft upstream.
name: USINANDO Windows

on:
  push:
    branches: [usinando]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: usinando-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: build (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - name: Build
        shell: pwsh
        env:
          PDFCRAFT_REQUIRE_WINRES: "1"
        run: cargo build --release -p pdfcraft

      - name: Package
        shell: pwsh
        run: |
          $out = "PdfCraft-USINANDO"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item target/release/pdfcraft.exe $out
          Copy-Item LICENSE-MIT, LICENSE-APACHE, NOTICE, ATTRIBUTION.md $out
          Copy-Item assets/app-icon/LICENSE-document.txt $out
          Copy-Item packaging/usinando/LEIA-ME.txt $out
          "$(git log -1 --format='%h %cs') (branch usinando)" | Out-File "$out/versao.txt" -Encoding utf8

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PdfCraft-USINANDO-windows-x64
          path: PdfCraft-USINANDO
          retention-days: 30

  tests:
    name: tests (print area)
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux system dependencies (egui/winit/rfd)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - name: Engine and automation
        run: |
          cargo test -p pdfcraft-print
          cargo test -p pdfcraft-automation --test automation printing_through_tools

      - name: Interface
        run: |
          cargo test -p pdfcraft-ui-egui --test viewer snapshot
          cargo test -p pdfcraft-ui-egui --test print
          cargo test -p pdfcraft-ui-egui --lib print_ui
          cargo test -p pdfcraft-ui-egui --lib brazilian_portuguese

      - name: Clippy
        if: always()
        run: cargo clippy -p pdfcraft-print -p pdfcraft-automation -p pdfcraft-ui-egui --all-targets -- -D warnings

      - name: Format (as a patch to apply)
        if: always()
        run: |
          cargo fmt --all
          git diff > fmt.patch
          git diff --stat

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fmt-patch
          path: fmt.patch
          retention-days: 7
